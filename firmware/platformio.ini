[platformio]
default_envs = esp8266_d1mini, esp32cam

;--------------------------------------------------------
;  Gemeinsame Voreinstellungen (gelten für alle Umgebungen)
;--------------------------------------------------------
[env]
framework         = arduino               ; oder espidf für reine ESP32-Projekte
monitor_speed     = 115200
build_flags       =                         \
   -D PROJECT_NAME=\"LEGO-Controller\"      \
   -D FW_VERSION=\"1.3.0\"
lib_deps          =
   ; Bibliotheken, die wirklich auf allen Boards benötigt werden
   ottowinter/ESPAsyncWebServer-esphome@^3.0.0
   bblanchon/ArduinoJson@^7.2.0

;--------------------------------------------------------
;  Gemeinsame Sektion pro MCU-Familie
;--------------------------------------------------------
[env:esp8266]
platform          = espressif8266
build_flags       = -D MCU_ESP8266
lib_deps          =
   ESP8266WiFi
   LittleFS

[env:esp32]
platform          = espressif32
build_flags       = -D MCU_ESP32
lib_deps          =
   WiFi
   FFat                    ; universelles FAT-FS für ESP32
   adafruit/Adafruit GFX Library
   adafruit/Adafruit SSD1306
   adafruit/Adafruit PWM Servo Driver Library @ ^2.4.0
   ESP32Async/ESPAsyncWebServer @ ^3.7.0
   bblanchon/ArduinoJson
lib_ignore        = LittleFS                ; verhindert doppelte FS-Implementierung

;--------------------------------------------------------
;  Konkrete Boards
;--------------------------------------------------------
[env:esp8266_d1mini]
extends           = env:esp8266
board             = d1_mini
build_flags       = -D BOARD_D1MINI
; hier sind weder Kamera noch SD-Slot interessant

[env:esp8266_01]
extends           = env:esp8266
board             = esp8266-01
build_flags       = -D BOARD_ESP8266_01

[env:esp32cam]
extends           = env:esp32
board             = esp32cam
build_flags       =                           \
   -D BOARD_ESP32CAM                           \
   -D USE_CAMERA
lib_deps          =
   esp32-camera
   ; FFat kommt schon aus der esp32-Gruppe
lib_ignore        =
   ESPAsyncTCP                           ; nicht kamerarelevant